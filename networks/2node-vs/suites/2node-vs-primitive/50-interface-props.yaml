name: interface-props
description: |
  Self-contained interface property lifecycle on sw1:Ethernet40.
  Tests mtu, admin_status, and description set/verify primitives.
  The first property creates the interface's identity record and clearing
  the last one removes it.
requires: [setup-device]

steps:
  - name: set-mtu-9100
    action: newtron
    devices: [switch1]
    method: POST
    url: /nodes/{{device}}/interfaces/Ethernet40/set-property
    params: {property: mtu, value: "9100"}

  - name: verify-mtu
    action: newtron
    devices: [switch1]
    url: /nodes/{{device}}/configdb/PORT/Ethernet40
    expect:
      jq: '.mtu == "9100"'

  - name: set-admin-down
    action: newtron
    devices: [switch1]
    method: POST
    url: /nodes/{{device}}/interfaces/Ethernet40/set-property
    params: {property: admin_status, value: down}

  - name: verify-admin-down
    action: newtron
    devices: [switch1]
    url: /nodes/{{device}}/configdb/PORT/Ethernet40
    expect:
      jq: '.admin_status == "down"'

  - name: set-admin-up
    action: newtron
    devices: [switch1]
    method: POST
    url: /nodes/{{device}}/interfaces/Ethernet40/set-property
    params: {property: admin_status, value: up}

  - name: verify-admin-up
    action: newtron
    devices: [switch1]
    url: /nodes/{{device}}/configdb/PORT/Ethernet40
    expect:
      jq: '.admin_status == "up"'

  - name: set-description
    action: newtron
    devices: [switch1]
    method: POST
    url: /nodes/{{device}}/interfaces/Ethernet40/set-property
    params: {property: description, value: "test-interface-props"}

  - name: verify-description
    action: newtron
    devices: [switch1]
    url: /nodes/{{device}}/configdb/PORT/Ethernet40
    expect:
      jq: '.description == "test-interface-props"'

  # Cleanup: clear sub-resource intents, then unconfigure interface
  - name: clear-mtu
    action: newtron
    devices: [switch1]
    method: POST
    url: /nodes/{{device}}/interfaces/Ethernet40/clear-property
    params: {property: mtu}

  - name: clear-description
    action: newtron
    devices: [switch1]
    method: POST
    url: /nodes/{{device}}/interfaces/Ethernet40/clear-property
    params: {property: description}

  # The last record removed above takes the interface's identity record with it.
  - name: verify-ethernet40-identity-reaped
    action: newtron
    devices: [switch1]
    url: /nodes/{{device}}/configdb/NEWTRON_INTENT/interface%7CEthernet40/exists
    expect:
      jq: '.exists == false'
